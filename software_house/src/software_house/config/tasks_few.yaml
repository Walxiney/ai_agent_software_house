# This file contains the tasks for the software house project.
define_requirements:
  name: define_requirements
  description: >
    Coletar e estruturar os requisitos do projeto "{project_name}", analisando profundamente as necessidades do negócio e objetivos estratégicos.  
    Criar um backlog priorizado com user stories claras e bem definidas, garantindo alinhamento com as expectativas do cliente.  
    Definir critérios de aceitação que facilitem a validação do produto final.  

    Descrição do projeto:
    {project_description}

  expected_output: >
    - Um backlog detalhado contendo user stories organizadas por prioridade.  
    - Critérios de aceitação bem definidos para cada funcionalidade.  
    - Lista de requisitos técnicos e não técnicos essenciais para o projeto.  
  agent: product_owner
  output_file: software_house/src/software_house/agent_output/product_owner.md

design_architecture:
  name: design_architecture
  description: >
    Criar a arquitetura do software para o projeto "{project_name}", garantindo modularidade, escalabilidade e segurança.  
    Definir padrões de desenvolvimento, tecnologias recomendadas e estrutura dos componentes principais.  
    O backend deve ser priorizado em Python, caso a linguagem não esteja especificada na descrição do projeto.  

    Descrição do projeto:
    {project_description}

  expected_output: >
    - Documento detalhado da arquitetura do sistema com diagramas UML.  
    - Definição clara de camadas (frontend, backend, banco de dados, APIs, segurança).  
    - Justificativa das escolhas tecnológicas e padrões adotados.  
    - Plano para comunicação eficiente entre componentes e fluxo de dados.  
  agent: software_architect
  output_file: software_house/src/software_house/agent_output/software_architect.md

write_documentation:
  name: write_documentation
  description: >
    Gerar documentação técnica completa para o projeto {project_name}, incluindo API docs, guias de usuário e manuais de referência para desenvolvedores.

    Descrição do projeto:
    {project_description}

  expected_output: >
    Documentação clara e organizada, utilizando Markdown, Swagger e Wiki para fácil consulta.
  agent: technical_writer
  output_file: software_house/src/software_house/agent_output/technical_writer.md

code_task:
  name: code_task
  description: >
    You will create a complete project, {project_name}, using python in the backend, and for frontend you can chose the approach and stack,
    these are the instructions:

    Instructions
    ------------
    {project_description}
    
  expected_output: >
    Your Final answer must be the full frontend and backend code, only the frontend and backend code and nothing else.
  agent: fullstack_engineer_agent
  output_file: software_house/src/software_house/agent_output/fullstack_engineer_agent.py

review_task:
  name: review_task
  description: >
    You will create a complete project, {project_name}, using python in the backend, and for frontend you can chose the approach and stack,
    these are the instructions:

    Instructions
    ------------
    {project_description}

    Using the code you got, check for errors. Check for logic errors,
    syntax errors, missing imports, variable declarations, mismatched brackets,
    and security vulnerabilities.
  
  expected_output: >
    Your Final answer must be the full frontend and backend code, only the frontend and backend code and nothing else.
  agent: qa_engineer_agent
  output_file: software_house/src/software_house/agent_output/qa_engineer_agent.py

evaluate_task:
  name: evaluate_task
  description: >
    You are helping create a project, {project_name}, using python in the backend, and for frontend you can chose the approach and stack,
    these are the instructions:

    Instructions
    ------------
    {project_description}

    You will look over the code to insure that it is complete and
    does the job that it is supposed to do.
  
  expected_output: >
    Your Final answer must be the full frontend and backend code, only the frontend and backend code and nothing else.
  agent: chief_qa_engineer_agent
  output_file: software_house/src/software_house/agent_output/chief_qa_engineer_agent.py

code_aggregation_task:
  name: code_aggregation_task
  description: >
    You are responsible for organizing and structuring the project {project_name}.
    The backend is built using Python, and for the frontend, you can choose the most 
    appropriate stack based on the project requirements.

    Instructions
    ------------
    {project_description}

    Your job is to review, aggregate, and organize all frontend and backend code, ensuring 
    that the project structure is clear. You must also check if execution steps are present 
    in the documentation; if they are missing, add them to guide the user in running the project.
  
  expected_output: >
    The final output must be a structured frontend and backend project, properly documented, 
    with all required steps to execute the project. Output only the structured code and documentation.
  agent: code_aggregator_agent
  output_file: software_house/src/software_house/agent_output/code_aggregator_agent.md

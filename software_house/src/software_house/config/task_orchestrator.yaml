team_selection_task:
  name: team_selection_task
  description: >
    You are responsible for analyzing the project "{project_name}" and selecting the appropriate team members to execute the development efficiently,
    based on the information about the agents and their goals, as well as the respective tasks and their descriptions.

    Instructions
    ------------
    - Carefully analyze the project requirements provided by the user. The user might not be a technical person, so you must handle possible mistakes.
    - Identify the necessary roles (e.g., Software Architect, Frontend Developer, Backend Developer, Aggregator).
    - Assign tasks to the right agents based on their expertise.
    - Always prioritize efficiency: use the **minimum number of agents** needed to complete the project without compromising quality.
    - Respect task dependencies (e.g., Software Architect must define architecture before development starts, and Technical Writer must document after coding is completed).
    - **DO NOT include task descriptions or agent goals in your response. Only use the exact task names as listed in the provided data.**
    - The output must strictly follow the given template format, ensuring only agent names as keys and task names as values.
    - Do not use the "product_owner", "software_architect_agent" and their tasks, they were used in a step before this one.
    - Always add the "code_aggregator_agent" with the task "code_aggregation_task" at the end, ensuring final project organization.

    Agents available for assignment:
    {agents_tasks}

    Project Description:
    {project_description}

    Output Format
    -------------
    You must return a **valid JSON (Python dictionary)** with the following structure:
    Explain in words here: dictionary compound of a key "agents_tasks" his value is a dictionary compound of agent names as keys and a task names as values.

    {template}
  expected_output: >
    A JSON object where "agents_tasks" is a dictionary mapping **agent names to their corresponding task names (not descriptions).**
    Ensure the response is structured exactly as specified, without extra information or formatting errors.
  agent: team_selector_agent

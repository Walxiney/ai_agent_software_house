project:
  - project_name: "Dropoff Detection System"
    project_description: >
      Uma aplicação web (construida no idioma Inglês) para validação se um pacote foi entregue no local correto, o ususario preenche um campo de texto com a descrição onde o pacote foi deixado e em seguida carrega uma imagem do local onde o pacote foi deixado, a aplicação então valida se a descrição é compativel com a imagem, caso não seja a aplicação retorna uma mensagem 'Invalid' caso esteja correto retorna 'Valid'.
      
      Features frontend:
      - Titulo do aplicativo: Dropoff Detection System,
      - Caixa de texto para inserir a descrição do local onde o pacote foi deixado,
      - Botão para carregar a imagem do local onde o pacote foi deixado,
      - Botão para visualizar a imagem carregada, clicar abre a imagem na mesma tela e ao clicar no botao novamente fecha a imagem,
      - Botão para rodar a verificação da imagem carregada em relação ao texto de descrição colocada na caixa de texto,
      - Mensagem de retorno 'Valid' ou 'Invalid' logo posicionada em um local visivel.
      - Botão do tipo de expandir e recolher para visualizar a explicação dada pelo LLM sobre a analise feita (reasoning).
      
      Features backend:
      - Use lingugem de programação Python,
      - De preferencia por usar FastAPI para o backend para comunicar ocm o frontend,
      - Receber amensage de texto e a imagem,
      - Fazer encode da imagem usando base64 para enviar para o modelo de linguagem,
      - Usar OpenAI API para enviar a descrição e a imagem para o modelo de linguagem,
      - Usar modelo de linguagem gpt-4o par analisar a descrição e a imagem,
      - Usar este prompt para o LLM: prompt=[
          {
              "role": "system",
              "content": "You will receive an image as input and a description about a parcel delivered place. Your task is to check if the place where the parcel is in the image match with the description gave by the deliver. You must carefully analyze the image and the description to determine if the parcel is in the correct place.
              
              Rules to accomplish the task:
              - If the place where the parcel is in the image match with the description gave by the deliver, your final answer must be 'Valid'.
              - If the place where the parcel is in the image doesn't match with the description gave by the deliver, your final answer must be 'Invalid'.
              - Answer must be in a JSON format:
                  {
                      "answer": <"Valid" or "Invalid">
                      "reasoning": <"The reasoning you used to determine the answer, give the details why is Valis or Invalid">
                  }
              
              Important rules to follow during checking the image:
              - The image must not have any people in it, close or far of the parcel, if there is a person in the image you must explain the reasoning and say that is 'Invalid'.
              - The image must not have any part of the body, such as a photo where the deliver have the parcel on his hands, you must explain the reasoning and say that is 'Invalid'.
              - If no package is visible, respond that no package was found in the image, and say that is 'Invalid'."
          },
          {
              "role": "user",
              "content": [
                  {
                      "type": "text",
                      "text": <"A descrição do usuario onde o parcel foi deixado vai aqui">,
                  },
                  {
                      "type": "image_url",
                      "image_url": {
                          "url": f"data:image/png;base64,{<image codificada usando base64>}"
                      }
                  }
              ]
          }
      ]
      
      - Usar este codigo já atualizado para fazer a chamada na API da OpenAI esta atualizado e funciona ja com o formato de resposta esperado:
          from openai import OpenAI
          import os
          from dotenv import load_dotenv
          load_dotenv()
          openai_client = OpenAI(api_key=os.getenv("OPENAI_KEY"))
          response = openai_client.chat.completions.create(
              model="gpt-4o",
              messages=prompt,
              response_format={"type": "json_object"}
          )
      - Deve ser capaz de rceber imagens em formato .png, .jpeg, .jpg e .webp portanto deverá tratar esta parte do prompt "url": f"data:image/png;base64,{<image codificada usando base64>}" para receber o formato adequado
      - Seguir as boas praticas de backend e programação, comentar adequadamente o código e criar as funções de forma modularizada.

      Documentation_requirements:
      - Guia de instalação e configuração,
      - API documentation,
      - Guia do usuário para a interface web.
      - Organização de pastas e guia para execução do codigo